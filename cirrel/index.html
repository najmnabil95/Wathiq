<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04080e" />
    <meta name="description" content="سيريل — لوحة تحكم متجر كِلن آند ليف بأسلوب الزجاج السائل." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>سيريل — كِلن آند ليف</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('cirrel:theme')
          const theme =
            stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
